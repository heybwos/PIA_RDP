; Firmware del PIA: ESP32 DevKit V1 (ESP32-WROOM-32).
; Cada entorno compila un solo programa de src/ con build_src_filter.

[platformio]
default_envs = test_huella_imagen

[env]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
upload_speed = 921600

; Prueba de la compuerta G1: ¿el AS608 entrega la imagen cruda?
[env:test_huella_imagen]
build_src_filter = -<*> +<pruebas/test_huella_imagen.cpp>
