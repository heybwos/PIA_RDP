; Firmware del PIA: ESP32 DevKit V1 (ESP32-WROOM-32).
; Cada entorno compila un solo programa de src/ con build_src_filter.
; Principal: esp32dev. Pruebas por módulo (P4): test_teclado, test_oled, test_leds, test_servos.
; Prueba de imagen (G1): test_huella_imagen.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    chris--a/Keypad@3.1.1
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.2
    madhephaestus/ESP32Servo@3.0.6

[env:esp32dev]
build_src_filter = +<*> -<pruebas/>

[env:test_huella_imagen]
build_src_filter = -<*> +<pruebas/test_huella_imagen.cpp>

[env:test_teclado]
build_src_filter = -<*> +<pruebas/test_teclado.cpp> +<teclado.cpp>

[env:test_oled]
build_src_filter = -<*> +<pruebas/test_oled.cpp> +<pantalla.cpp>

[env:test_leds]
build_src_filter = -<*> +<pruebas/test_leds.cpp>

[env:test_servos]
build_src_filter = -<*> +<pruebas/test_servos.cpp>
