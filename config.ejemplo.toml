# Copia de ejemplo. Al arrancar, si no existe config.toml, se copia este archivo.
# config.toml es local y no se sube a git.

[serie]
puerto = "auto"            # "COM5", "auto" o "socket://127.0.0.1:5333" (ESP32 falso)
baudios = 921600           # si el adaptador USB falla, 115200 (y lo mismo en firmware/src/config.h)

[huella]
fuente_esp32 = "sensor"    # "sensor" o "banco" (plan B)
nibble_alto_primero = true # se decide en la compuerta G1 mirando los dos PNG
banco_simular = "fvc2002"  # "fvc2002" o "sintetico"

[camara]
fuente = "url"             # "url", "indice" o "dataset"
url = ""                   # PRINCIPAL: IP Webcam en la WiFi de la facultad. Se llena en el salón con
                           #   probar_camara.py --url http://<IP>:8080/video --guardar-url
url_respaldo = "http://10.28.183.166:8080/video"   # hotspot del celular: se usa si la principal no contesta
indice = 1
rotacion = 90             # 0, 90, 180 o 270 (horario). Celular en vertical: 90. probar_camara.py la detecta
rostro_simular = "dataset" # "dataset" o "camara"

[decision]
peso_huella = 0.5
peso_rostro = 0.5
umbral_factor = 0.50
umbral_fusion = 0.60

[registro]
capturas_huella = 5
cuadros_rostro = 15

[actuadores]
ms_entre_servos = 300
ang_cerrado = 0             # medido en P4.5 (los dos servos)
ang_abierto = 90
ms_abierto = 0              # 0: los servos quedan abiertos hasta "Intentar de nuevo" o la tecla #

[datos]
carpeta = "datos"
guardar_intentos = true
